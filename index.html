<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Maison Nuée — vitrine de cosméticos. Navegue e solicite orçamento no WhatsApp." />
    <title>Maison Nuée — Catálogo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Figtree', 'system-ui', 'sans-serif'],
            },
            colors: {
              brand: {
                ink: '#1c1917',
                muted: '#78716c',
                accent: '#0f766e',
              },
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="css/app.css" />

    <script defer src="js/config.js"></script>
    <script defer src="js/catalog.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  </head>
  <body class="app-shell text-stone-900 font-sans antialiased" x-data="catalogApp" x-cloak>
    <!-- Sticky header -->
    <header class="sticky top-0 z-40 border-b border-stone-200/70 bg-stone-50/90 backdrop-blur-md">
      <div class="mx-auto max-w-6xl px-3 pt-3 pb-2 sm:px-4">
        <div class="flex items-center gap-3">
          <a href="./" class="brand-mark min-w-0 shrink-0" aria-label="Maison Nuée — início">
            <span class="block text-lg font-semibold tracking-tight text-stone-900 sm:text-xl" x-text="brandName"></span>
          </a>

          <div class="ml-auto flex items-center gap-2">
            <a
              :href="whatsappUrl(null)"
              target="_blank"
              rel="noopener noreferrer"
              class="inline-flex items-center gap-1.5 rounded-full border border-stone-300 bg-white px-3 py-1.5 text-xs font-medium text-stone-700 transition hover:border-stone-400 hover:bg-stone-100"
            >
              <svg class="h-3.5 w-3.5 text-emerald-600" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z" />
              </svg>
              Contato
            </a>
          </div>
        </div>

        <!-- Search -->
        <div class="mt-3">
          <label class="sr-only" for="search">Buscar produtos</label>
          <div class="relative">
            <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-stone-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M11 18a7 7 0 100-14 7 7 0 000 14z" />
            </svg>
            <input
              id="search"
              type="search"
              x-model.debounce.150ms="searchQuery"
              placeholder="Buscar por nome ou código…"
              class="w-full rounded-xl border border-stone-200 bg-white py-2.5 pl-9 pr-3 text-sm text-stone-900 placeholder:text-stone-400 outline-none ring-brand-accent/30 focus:border-brand-accent focus:ring-2"
              autocomplete="off"
            />
          </div>
        </div>

        <!-- Category pills -->
        <div class="pills-scroll mt-3 -mx-3 flex gap-2 overflow-x-auto px-3 pb-1 sm:-mx-4 sm:px-4" role="tablist" aria-label="Categorias">
          <button
            type="button"
            role="tab"
            :aria-selected="activeCategory === 'all'"
            @click="setCategory('all')"
            :class="activeCategory === 'all'
              ? 'bg-stone-900 text-white border-stone-900'
              : 'bg-white text-stone-700 border-stone-200 hover:border-stone-300'"
            class="shrink-0 rounded-full border px-3.5 py-1.5 text-xs font-medium transition"
          >
            Todos
          </button>
          <template x-for="cat in categories" :key="cat.slug">
            <button
              type="button"
              role="tab"
              :aria-selected="activeCategory === cat.slug"
              @click="setCategory(cat.slug)"
              :class="activeCategory === cat.slug
                ? 'bg-stone-900 text-white border-stone-900'
                : 'bg-white text-stone-700 border-stone-200 hover:border-stone-300'"
              class="shrink-0 rounded-full border px-3.5 py-1.5 text-xs font-medium transition"
              x-text="cat.label"
            ></button>
          </template>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-3 py-4 sm:px-4 sm:py-6">
      <!-- Catalog intro -->
      <section
        x-show="!loading && !error"
        x-cloak
        class="catalog-intro mb-5 sm:mb-6"
        aria-label="Apresentação do catálogo"
      >
        <p class="text-[11px] font-semibold uppercase tracking-[0.18em] text-brand-accent">Catálogo</p>
        <h1 class="mt-1 text-2xl font-semibold tracking-tight text-stone-900 sm:text-3xl">
          <span x-text="brandName"></span>
        </h1>
        <p class="mt-1.5 max-w-xl text-sm leading-relaxed text-stone-500">
          Cosméticos selecionados. Filtre, abra o detalhe e solicite orçamento no WhatsApp — sem carrinho.
        </p>
      </section>

      <!-- Results meta -->
      <div
        x-show="!loading && !error"
        x-cloak
        class="mb-3 flex items-center justify-between gap-3"
      >
        <p class="text-xs font-medium text-stone-500" aria-live="polite" x-text="resultsLabel"></p>
        <button
          type="button"
          x-show="hasActiveFilters"
          @click="clearFilters()"
          class="text-xs font-semibold text-brand-accent transition hover:text-teal-700"
        >
          Limpar filtros
        </button>
      </div>

      <!-- Loading -->
      <div x-show="loading" class="py-16 text-center text-sm text-stone-500">
        Carregando catálogo…
      </div>

      <!-- Error -->
      <div x-show="!loading && error" class="rounded-2xl border border-red-200 bg-red-50 px-4 py-6 text-center text-sm text-red-800" x-text="error"></div>

      <!-- Empty state -->
      <div
        x-show="!loading && !error && filteredProducts.length === 0"
        class="flex flex-col items-center justify-center px-4 py-16 text-center"
      >
        <p class="text-base font-medium text-stone-900">Nenhum produto encontrado</p>
        <p class="mt-1 max-w-xs text-sm text-stone-500">
          Tente outro termo ou limpe os filtros para ver o catálogo completo.
        </p>
        <button
          type="button"
          @click="clearFilters()"
          class="mt-5 rounded-full bg-stone-900 px-5 py-2.5 text-sm font-medium text-white transition hover:bg-stone-800"
        >
          Limpar filtros
        </button>
      </div>

      <!-- Product grid -->
      <div
        x-show="!loading && !error && filteredProducts.length > 0"
        class="product-grid grid grid-cols-2 gap-3 md:grid-cols-3 lg:grid-cols-4 md:gap-4"
      >
        <template x-for="(product, index) in filteredProducts" :key="product.id">
          <article class="product-card" :style="`--card-i: ${index}`">
            <button
              type="button"
              @click="openProduct(product)"
              class="group w-full text-left focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-accent focus-visible:ring-offset-2"
            >
              <div class="relative aspect-[4/5] overflow-hidden rounded-xl bg-stone-200">
                <img
                  :src="product.images[0]"
                  :alt="product.name"
                  loading="lazy"
                  decoding="async"
                  @error="onImageError($event)"
                  class="h-full w-full object-cover transition duration-300 group-hover:scale-[1.03]"
                />
                <span
                  x-show="product.badge"
                  class="absolute left-2 top-2 rounded-full bg-white/95 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-stone-800 shadow-sm"
                  x-text="product.badge"
                ></span>
              </div>
              <div class="mt-2 space-y-0.5 px-0.5">
                <p class="text-[10px] font-medium uppercase tracking-wider text-stone-400" x-text="product.category.label"></p>
                <h2 class="line-clamp-2 text-sm font-medium leading-snug text-stone-900" x-text="product.name"></h2>
                <p class="text-sm font-semibold text-stone-800" x-text="formatPrice(product.price)"></p>
              </div>
            </button>
          </article>
        </template>
      </div>
    </main>

    <!-- Product detail: backdrop + sheet/modal -->
    <div
      x-show="sheetOpen"
      x-transition.opacity.duration.200ms
      class="fixed inset-0 z-50"
      role="dialog"
      aria-modal="true"
      :aria-label="selectedProduct ? selectedProduct.name : 'Detalhe do produto'"
    >
      <div class="absolute inset-0 bg-stone-900/40" @click="closeProduct()"></div>

      <div
        x-ref="sheetPanel"
        x-show="sheetOpen"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="translate-y-full md:translate-y-4 md:opacity-0 md:scale-95"
        x-transition:enter-end="translate-y-0 md:opacity-100 md:scale-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="translate-y-0 md:opacity-100 md:scale-100"
        x-transition:leave-end="translate-y-full md:translate-y-4 md:opacity-0 md:scale-95"
        class="sheet-panel absolute inset-x-0 bottom-0 flex flex-col overflow-hidden rounded-t-[1.25rem] bg-white shadow-2xl md:inset-auto md:left-1/2 md:top-1/2 md:w-full md:max-w-lg md:-translate-x-1/2 md:-translate-y-1/2 md:rounded-2xl"
        @click.stop
      >
        <template x-if="selectedProduct">
          <div class="flex min-h-0 flex-1 flex-col">
            <!-- Drag handle (mobile) -->
            <div class="flex shrink-0 items-center justify-between px-4 pt-3 md:pt-4">
              <div class="mx-auto h-1 w-10 rounded-full bg-stone-300 md:hidden" aria-hidden="true"></div>
              <button
                type="button"
                data-sheet-close
                @click="closeProduct()"
                class="absolute right-3 top-3 z-10 flex h-9 w-9 items-center justify-center rounded-full bg-stone-100 text-stone-600 transition hover:bg-stone-200"
                aria-label="Fechar"
              >
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>

            <!-- Scrollable content -->
            <div class="min-h-0 flex-1 overflow-y-auto overscroll-contain px-4 pb-4 pt-2 md:px-5">
              <!-- Gallery -->
              <div class="relative aspect-[4/5] overflow-hidden rounded-xl bg-stone-100 sm:aspect-[5/4]">
                <img
                  :src="selectedProduct.images[galleryIndex]"
                  :alt="selectedProduct.name"
                  class="h-full w-full object-cover"
                  decoding="async"
                  @error="onImageError($event)"
                />
                <template x-if="selectedProduct.images.length > 1">
                  <div>
                    <button
                      type="button"
                      @click="prevImage()"
                      class="absolute left-2 top-1/2 flex h-8 w-8 -translate-y-1/2 items-center justify-center rounded-full bg-white/90 text-stone-800 shadow"
                      aria-label="Imagem anterior"
                    >
                      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
                    </button>
                    <button
                      type="button"
                      @click="nextImage()"
                      class="absolute right-2 top-1/2 flex h-8 w-8 -translate-y-1/2 items-center justify-center rounded-full bg-white/90 text-stone-800 shadow"
                      aria-label="Próxima imagem"
                    >
                      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>
                    </button>
                    <div class="absolute bottom-2 left-1/2 flex -translate-x-1/2 gap-1.5">
                      <template x-for="(img, i) in selectedProduct.images" :key="i">
                        <button
                          type="button"
                          @click="galleryIndex = i"
                          :class="galleryIndex === i ? 'bg-white' : 'bg-white/50'"
                          class="h-1.5 w-1.5 rounded-full"
                          :aria-label="'Ir para imagem ' + (i + 1)"
                        ></button>
                      </template>
                    </div>
                  </div>
                </template>
                <span
                  x-show="selectedProduct.badge"
                  class="absolute left-2 top-2 rounded-full bg-white/95 px-2.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-stone-800 shadow-sm"
                  x-text="selectedProduct.badge"
                ></span>
              </div>

              <p class="mt-4 text-xs font-medium uppercase tracking-wider text-stone-400">
                Ref: <span class="text-stone-600" x-text="selectedProduct.ref"></span>
              </p>
              <h2 class="mt-1 text-xl font-semibold tracking-tight text-stone-900" x-text="selectedProduct.name"></h2>
              <p class="mt-1 text-base font-semibold text-stone-800" x-text="formatPrice(selectedProduct.price)"></p>
              <p class="mt-3 text-sm leading-relaxed text-stone-600" x-text="selectedProduct.shortDescription"></p>

              <dl class="mt-5 divide-y divide-stone-100 border-t border-stone-100">
                <template x-for="spec in selectedProduct.specs" :key="spec.label">
                  <div class="flex justify-between gap-4 py-2.5 text-sm">
                    <dt class="text-stone-400" x-text="spec.label"></dt>
                    <dd class="text-right font-medium text-stone-800" x-text="spec.value"></dd>
                  </div>
                </template>
              </dl>
            </div>

            <!-- Sticky CTA footer -->
            <div class="shrink-0 border-t border-stone-200 bg-white px-4 pb-[max(1rem,env(safe-area-inset-bottom))] pt-3 md:px-5">
              <div class="flex gap-2">
                <button
                  type="button"
                  @click="shareProduct(selectedProduct)"
                  class="inline-flex h-12 w-12 shrink-0 items-center justify-center rounded-xl border border-stone-200 bg-white text-stone-700 transition hover:bg-stone-50"
                  aria-label="Compartilhar produto"
                >
                  <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M16 6l-4-4-4 4M12 2v13" />
                  </svg>
                </button>
                <a
                  :href="whatsappUrl(selectedProduct)"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="cta-whatsapp flex h-12 flex-1 items-center justify-center gap-2 rounded-xl px-4 text-sm font-semibold text-white transition"
                >
                  <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z" />
                  </svg>
                  Solicitar orçamento no WhatsApp
                </a>
              </div>
              <p
                x-show="shareFeedback"
                x-transition
                class="share-toast mt-2 text-center text-xs font-medium text-brand-accent"
                x-text="shareFeedback"
              ></p>
            </div>
          </div>
        </template>
      </div>
    </div>
  </body>
</html>
